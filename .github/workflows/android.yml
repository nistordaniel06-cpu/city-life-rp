name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Godot and templates
        run: |
          curl -fL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          curl -fL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.3.stable/
      - name: Prepare Android debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Validate project
        run: ./Godot_v4.3-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Export debug APK
        env:
          GODOT_ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          mkdir -p build
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --export-debug Android build/city-life-rp-v1.apk
          test -s build/city-life-rp-v1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: city-life-rp-v1-android
          path: build/city-life-rp-v1.apk
